<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎭 DiaDeCosplay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ff1493; padding-bottom: 15px; }
h1 { color: #ff1493; }
.sync-status { display: flex; align-items: center; gap: 10px; padding: 8px 15px; border-radius: 20px; background: #2a2a2a; font-size: 12px; }
.sync-status.online { background: #0d5c0d; color: #00ff00; }
.sync-status.offline { background: #5c0d0d; color: #ff6b6b; }
nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; }
nav button { padding: 10px 20px; border: none; background: transparent; color: #999; cursor: pointer; border-bottom: 3px solid transparent; }
nav button.active { color: #ff1493; border-bottom-color: #ff1493; }
.content { display: none; }
.content.active { display: block; }
.cosplayers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.card { background: #2a2a2a; padding: 15px; border-radius: 10px; overflow: hidden; }
.card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
.card h3 { color: #ff1493; margin-bottom: 10px; }
.card p { font-size: 13px; color: #bbb; margin-bottom: 10px; }
.buttons { display: flex; gap: 10px; }
button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; }
.btn-primary { background: #ff1493; color: white; }
.btn-primary:hover { background: #ff1493cc; }
.btn-secondary { background: #333; color: #fff; }
.btn-secondary:hover { background: #444; }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
.modal.active { display: flex; }
.modal-content { background: #2a2a2a; padding: 30px; border-radius: 10px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h2 { color: #ff1493; }
.close { background: none; border: none; font-size: 24px; color: #999; cursor: pointer; }
input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 5px; }
textarea { resize: vertical; min-height: 100px; }
.alert { padding: 15px; border-radius: 5px; margin-bottom: 15px; }
.alert-success { background: #0d5c0d; color: #00ff00; }
.alert-error { background: #5c0d0d; color: #ff6b6b; }
.alert-info { background: #0d3c5c; color: #00bfff; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
.photo-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 5px; cursor: pointer; }
.loader { text-align: center; padding: 20px; }
.spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #ff1493; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.event-card { background: #1a1a1a; padding: 15px; border-left: 4px solid #ff1493; margin-bottom: 15px; border-radius: 5px; }
.event-card h4 { color: #ff1493; margin-bottom: 5px; }
.event-card .date { font-size: 12px; color: #888; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🎭 DiaDeCosplay</h1>
    <div class="sync-status online" id="syncStatus">
      <i class="fas fa-check-circle"></i>
      <span id="syncText">Online</span>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" data-tab="cosplayers">👥 Cosplayers</button>
    <button class="nav-btn" data-tab="eventos">📅 Eventos</button>
    <button class="nav-btn" data-tab="ideias">💡 Ideias</button>
    <button class="nav-btn" data-tab="colabs">👯 Colabs</button>
    <button class="nav-btn" data-tab="admin">⚙️ Admin</button>
  </nav>

  <!-- COSPLAYERS -->
  <div class="content active" id="cosplayers-content">
    <button class="btn-primary" onclick="openCosPerfil()">➕ Novo Cosplayer</button>
    <div id="cosplayersGrid" class="cosplayers-grid"></div>
  </div>

  <!-- EVENTOS -->
  <div class="content" id="eventos-content">
    <button class="btn-primary" onclick="openEventModal()">➕ Novo Evento</button>
    <div id="eventosList"></div>
  </div>

  <!-- IDEIAS -->
  <div class="content" id="ideias-content">
    <button class="btn-primary" onclick="openIdeiaModal()">➕ Nova Ideia</button>
    <div id="ideiasList"></div>
  </div>

  <!-- COLABS -->
  <div class="content" id="colabs-content">
    <button class="btn-primary" onclick="openColabModal()">➕ Nova Colab</button>
    <div id="colabsList"></div>
  </div>

  <!-- ADMIN -->
  <div class="content" id="admin-content">
    <div style="background: #2a2a2a; padding: 20px; border-radius: 10px;">
      <h2>⚙️ Painel Admin</h2>
      <div style="margin-top: 20px;">
        <label>URL do Worker:</label>
        <input type="text" id="workerUrl" placeholder="https://seu-worker.dev" value="">
        
        <label>Chave de Escrita:</label>
        <input type="text" id="writeKey" placeholder="diadecosplay2026" value="">
        
        <button class="btn-primary" onclick="saveConfig()">💾 Salvar Configuração</button>
        <button class="btn-secondary" onclick="syncAgora()">🔄 Sincronizar Agora</button>
        <button class="btn-secondary" onclick="limparDados()">🗑️ Limpar Dados Locais</button>
      </div>
      
      <div id="adminStatus" style="margin-top: 20px;"></div>
    </div>
  </div>
</div>

<!-- MODAL COSPLAYER -->
<div class="modal" id="modalCosplayer">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Perfil Cosplayer</h2>
      <button class="close" onclick="closeModal('modalCosplayer')">&times;</button>
    </div>
    <div id="cosplayerForm"></div>
  </div>
</div>

<script>
// 🔥 CONFIGURAÇÃO GLOBAL
const CONFIG = {
  workerUrl: localStorage.getItem('dc_worker_url') || '',
  writeKey: localStorage.getItem('dc_write_key') || '',
  syncInterval: 5000 // Sincroniza a cada 5 segundos
};

let db = {
  cosplayers: [],
  eventos: [],
  ideias: [],
  colabs: [],
  updatedAt: 0
};

// 🔄 SINCRONIZAÇÃO AUTOMÁTICA TEMPO REAL
async function autoSync() {
  if (!CONFIG.workerUrl) return;
  
  try {
    // BUSCA dados do servidor
    const response = await fetch(CONFIG.workerUrl, {
      method: 'GET',
      cache: 'no-store'
    });
    
    if (!response.ok) throw new Error(`Erro ${response.status}`);
    
    const serverData = await response.json();
    
    // Se servidor tem dados mais recentes, atualiza tudo
    if (serverData.updatedAt && serverData.updatedAt > db.updatedAt) {
      db = { ...serverData };
      render();
      updateSyncStatus(true);
    } else {
      updateSyncStatus(true);
    }
  } catch (error) {
    console.error('❌ Erro sync:', error);
    updateSyncStatus(false);
  }
}

// 📤 ENVIA dados pro servidor
async function sendToServer() {
  if (!CONFIG.workerUrl || !CONFIG.writeKey) {
    alert('❌ Configure URL e chave primeiro!');
    return;
  }

  try {
    db.updatedAt = Date.now();
    
    const response = await fetch(CONFIG.workerUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Write-Key': CONFIG.writeKey
      },
      body: JSON.stringify(db),
      cache: 'no-store'
    });
    
    if (!response.ok) throw new Error(`Erro ${response.status}`);
    
    console.log('✅ Dados enviados!');
    updateSyncStatus(true);
    
    // Sincroniza com outros usuários instantaneamente
    setTimeout(autoSync, 100);
    
  } catch (error) {
    console.error('❌ Erro envio:', error);
    updateSyncStatus(false);
    alert('❌ Erro ao enviar! Tente novamente.');
  }
}

// 💾 SALVAR COSPLAYER
async function saveCosplayer(id, data) {
  if (id === 'novo') {
    db.cosplayers.push({ id: Date.now(), ...data });
  } else {
    const idx = db.cosplayers.findIndex(c => c.id == id);
    if (idx >= 0) db.cosplayers[idx] = { id, ...data };
  }
  
  await sendToServer();
  closeModal('modalCosplayer');
  render();
}

// 📅 SALVAR EVENTO
async function saveEvento(data) {
  db.eventos.push({ id: Date.now(), ...data });
  await sendToServer();
  render();
}

// 💡 SALVAR IDEIA
async function saveIdeia(data) {
  db.ideias.push({ id: Date.now(), ...data });
  await sendToServer();
  render();
}

// 👯 SALVAR COLAB
async function saveColab(data) {
  db.colabs.push({ id: Date.now(), ...data });
  await sendToServer();
  render();
}

// 🖼️ UPLOAD DE FOTO
async function uploadFoto(file, cosplayerId) {
  if (!CONFIG.workerUrl || !CONFIG.writeKey) {
    alert('❌ Configure Worker primeiro!');
    return;
  }

  const reader = new FileReader();
  reader.onload = async (e) => {
    const dataUrl = e.target.result;
    
    try {
      // Envia foto pro servidor
      const fotoId = `foto_${Date.now()}`;
      const response = await fetch(`${CONFIG.workerUrl}/f/${fotoId}`, {
        method: 'POST',
        headers: { 'X-Write-Key': CONFIG.writeKey },
        body: dataUrl,
        cache: 'no-store'
      });
      
      if (!response.ok) throw new Error('Erro upload');
      
      // Adiciona URL da foto ao cosplayer
      const cosp = db.cosplayers.find(c => c.id == cosplayerId);
      if (cosp) {
        if (!cosp.photos) cosp.photos = [];
        cosp.photos.push(`${CONFIG.workerUrl}/f/${fotoId}`);
      }
      
      await sendToServer();
      render();
      alert('✅ Foto enviada!');
      
    } catch (error) {
      alert('❌ Erro ao enviar foto!');
    }
  };
  reader.readAsDataURL(file);
}

// 🎨 RENDERIZAR
function render() {
  renderCosplayers();
  renderEventos();
  renderIdeias();
  renderColabs();
}

function renderCosplayers() {
  const grid = document.getElementById('cosplayersGrid');
  grid.innerHTML = db.cosplayers.map(c => `
    <div class="card">
      ${c.photos && c.photos[0] ? `<img src="${c.photos[0]}" alt="${c.nome}">` : ''}
      <h3>${c.nome || 'Sem nome'}</h3>
      <p>${c.personagem || 'Personagem não informado'}</p>
      <div class="buttons">
        <button class="btn-primary" onclick="editCosplayer(${c.id})">✏️ Editar</button>
        <button class="btn-secondary" onclick="deleteCosplayer(${c.id})">🗑️ Deletar</button>
      </div>
    </div>
  `).join('');
}

function renderEventos() {
  const list = document.getElementById('eventosList');
  list.innerHTML = db.eventos.map(e => `
    <div class="event-card">
      <h4>${e.titulo}</h4>
      <p class="date">${new Date(e.data).toLocaleDateString('pt-BR')}</p>
      <p>${e.descricao}</p>
      <button class="btn-secondary" onclick="deleteEvento(${e.id})">🗑️ Deletar</button>
    </div>
  `).join('');
}

function renderIdeias() {
  const list = document.getElementById('ideiasList');
  list.innerHTML = db.ideias.map(i => `
    <div class="event-card">
      <h4>${i.titulo}</h4>
      <p>${i.descricao}</p>
      <button class="btn-secondary" onclick="deleteIdeia(${i.id})">🗑️ Deletar</button>
    </div>
  `).join('');
}

function renderColabs() {
  const list = document.getElementById('colabsList');
  list.innerHTML = db.colabs.map(c => `
    <div class="event-card">
      <h4>${c.tipo}</h4>
      <p>${c.descricao}</p>
      <button class="btn-secondary" onclick="deleteColab(${c.id})">🗑️ Deletar</button>
    </div>
  `).join('');
}

// ⚙️ ADMIN
function saveConfig() {
  const url = document.getElementById('workerUrl').value;
  const key = document.getElementById('writeKey').value;
  
  if (!url || !key) {
    alert('❌ Preencha URL e chave!');
    return;
  }
  
  CONFIG.workerUrl = url;
  CONFIG.writeKey = key;
  localStorage.setItem('dc_worker_url', url);
  localStorage.setItem('dc_write_key', key);
  
  alert('✅ Configuração salva!');
  autoSync();
}

function syncAgora() {
  autoSync();
  alert('🔄 Sincronizando...');
}

function limparDados() {
  if (confirm('⚠️ Deletar todos os dados locais?')) {
    localStorage.clear();
    location.reload();
  }
}

function updateSyncStatus(online) {
  const status = document.getElementById('syncStatus');
  const text = document.getElementById('syncText');
  
  if (online) {
    status.className = 'sync-status online';
    text.textContent = '✅ Online';
  } else {
    status.className = 'sync-status offline';
    text.textContent = '❌ Offline';
  }
}

// 🔀 NAVEGAÇÃO
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    
    e.target.classList.add('active');
    const tab = e.target.dataset.tab;
    document.getElementById(`${tab}-content`).classList.add('active');
  });
});

// MODAIS
function openCosPerfil() {
  document.getElementById('modalCosplayer').classList.add('active');
  document.getElementById('cosplayerForm').innerHTML = `
    <input type="text" id="nome" placeholder="Nome do cosplayer">
    <input type="text" id="personagem" placeholder="Personagem">
    <textarea id="descricao" placeholder="Descrição"></textarea>
    <label>Foto:</label>
    <input type="file" id="foto" accept="image/*" onchange="previewFoto(this)">
    <img id="fotoPreview" style="max-width: 200px; margin: 10px 0; display: none;">
    <button class="btn-primary" onclick="salvarCosPerfil()">💾 Salvar</button>
  `;
}

function salvarCosPerfil() {
  const nome = document.getElementById('nome').value;
  const personagem = document.getElementById('personagem').value;
  const descricao = document.getElementById('descricao').value;
  const foto = document.getElementById('foto').files[0];
  
  if (!nome) {
    alert('❌ Preencha o nome!');
    return;
  }
  
  const cosp = { nome, personagem, descricao, photos: [] };
  
  if (foto) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      cosp.photos = [e.target.result];
      db.cosplayers.push({ id: Date.now(), ...cosp });
      await sendToServer();
      closeModal('modalCosplayer');
      render();
    };
    reader.readAsDataURL(foto);
  } else {
    db.cosplayers.push({ id: Date.now(), ...cosp });
    sendToServer();
    closeModal('modalCosplayer');
    render();
  }
}

function openEventModal() {
  const titulo = prompt('Título do evento:');
  if (titulo) {
    const descricao = prompt('Descrição:');
    const data = prompt('Data (YYYY-MM-DD):');
    saveEvento({ titulo, descricao, data });
  }
}

function openIdeiaModal() {
  const titulo = prompt('Título da ideia:');
  if (titulo) {
    const descricao = prompt('Descrição:');
    saveIdeia({ titulo, descricao });
  }
}

function openColabModal() {
  const tipo = prompt('Tipo (Duo, Trio, Casal, etc):');
  if (tipo) {
    const descricao = prompt('Descrição:');
    saveColab({ tipo, descricao });
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function deleteCosplayer(id) {
  if (confirm('Deletar?')) {
    db.cosplayers = db.cosplayers.filter(c => c.id != id);
    sendToServer();
    render();
  }
}

function deleteEvento(id) {
  if (confirm('Deletar?')) {
    db.eventos = db.eventos.filter(e => e.id != id);
    sendToServer();
    render();
  }
}

function deleteIdeia(id) {
  if (confirm('Deletar?')) {
    db.ideias = db.ideias.filter(i => i.id != id);
    sendToServer();
    render();
  }
}

function deleteColab(id) {
  if (confirm('Deletar?')) {
    db.colabs = db.colabs.filter(c => c.id != id);
    sendToServer();
    render();
  }
}

// 🚀 INIT
window.addEventListener('load', () => {
  document.getElementById('workerUrl').value = CONFIG.workerUrl;
  document.getElementById('writeKey').value = CONFIG.writeKey;
  
  autoSync();
  
  // Sincroniza a cada 5 segundos AUTOMATICAMENTE
  setInterval(autoSync, CONFIG.syncInterval);
});
</script>

</body>
</html>
